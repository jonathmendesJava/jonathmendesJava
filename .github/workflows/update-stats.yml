name: Update README Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=jonathmendesJava&show_icons=true&hide_border=true
            &bg_color=0d0d0d&title_color=e8dcc8&text_color=cfc7b8&icon_color=c9a227&border_color=3d3d3d
          path: assets/github-stats.svg

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=jonathmendesJava&layout=compact&hide_border=true
            &bg_color=0d0d0d&title_color=e8dcc8&text_color=cfc7b8&icon_color=c9a227&border_color=3d3d3d
          path: assets/top-langs.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore(stats): atualizar cards noir"
          git push
